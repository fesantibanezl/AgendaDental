<ion-content>
  <main class="agenda-screen agenda-entry">
    <header class="marca">
      <h1>Agenda Dental</h1>
      <p class="agenda-lead">Reserva y consulta tus citas en la clínica.</p>
    </header>

    <ion-card>
      <ion-card-header><ion-card-title>Iniciar sesión</ion-card-title></ion-card-header>
      <ion-card-content>
        @if (cuentaCreada()) {
          <p class="confirmacion-registro" role="status">Tu cuenta está lista. Ingresa con tu contraseña.</p>
        }
        <!-- ngModel sincroniza los campos con TypeScript; ngSubmit ejecuta el ingreso. -->
        <form class="agenda-form" (ngSubmit)="ingresar()" autocomplete="off" novalidate>
          <ion-input
            label="Usuario" labelPlacement="stacked" fill="outline"
            name="usuario" autocomplete="off" autocapitalize="off"
            [spellcheck]="false" [(ngModel)]="usuario" required>
          </ion-input>
          <ion-input
            label="Contraseña" labelPlacement="stacked" fill="outline"
            name="clave" type="password" autocomplete="off"
            [(ngModel)]="clave" required>
          </ion-input>
          @if (error()) {
            <p class="agenda-form-error" role="alert">{{ error() }}</p>
          }
          <ion-button expand="block" type="submit" [disabled]="enviando()">
            {{ enviando() ? 'Ingresando…' : 'Ingresar' }}
          </ion-button>
        </form>
      </ion-card-content>
    </ion-card>

    <!-- Acceso a Registro para quienes todavía no tienen una cuenta. -->
    <section class="crear-cuenta" aria-labelledby="crear-cuenta-titulo">
      <h2 id="crear-cuenta-titulo">¿Todavía no tienes una cuenta?</h2>
      <ion-button expand="block" fill="outline" routerLink="/registro">Crear cuenta</ion-button>
    </section>
  </main>
</ion-content>
